# Link checker config for .github/workflows/link-check.yml

user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
max_retries = 3
timeout = 30

# 403/429 are bot-blocking or rate limits, not dead links.
accept = ["200..=299", "403", "429"]

# As of 2026-10-20, Pay For Print is VPN-only.
exclude = ['^https://payforprint\.ubc\.ca']
